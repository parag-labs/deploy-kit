<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="940" viewBox="0 0 1560 940" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="940" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">deploy-kit - secure-by-default deploy plans</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">One interface over local, Azure, and AWS: render a deterministic plan and fail closed the moment you weaken a secure default.</text><rect x="50" y="172" width="250" height="326" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="163" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">THE REQUEST</text><rect x="70" y="206" width="210" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,221) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="116" y="237" font-size="16.5" font-weight="700" fill="#17509f">App config</text><text x="87" y="259.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">app, image</text><text x="87" y="276.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">replicas = 2</text><rect x="70" y="305" width="210" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,320) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="116" y="336" font-size="16.5" font-weight="700" fill="#186547">Secure defaults</text><text x="87" y="358.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">tls, deny-all egress</text><text x="87" y="375.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">secrets from a vault</text><rect x="70" y="404" width="210" height="87" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,419) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.6 6H14a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h.5"/></g><text x="116" y="435" font-size="16.5" font-weight="700" fill="#3d4a63">Target name</text><text x="87" y="457.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">local, azure, aws</text><text x="87" y="474.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">-&gt; get_target(name)</text><rect x="360" y="235" width="257" height="150" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(476.5,249) scale(1.0000)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v4a4 4 0 0 0 4 4h8"/><path d="M6 21v-4a4 4 0 0 1 4-4h8"/><path d="M15 8l3 3-3 3"/><path d="M15 14l3 3-3 3"/></g><text x="488.5" y="293" text-anchor="middle" font-size="16.5" font-weight="700" fill="#552fae">get_target</text><text x="488.5" y="314.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">name -&gt; one target</text><text x="488.5" y="331.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">unknown -&gt; error</text><text x="488.5" y="349.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">a 3-entry registry</text><rect x="657" y="235" width="257" height="150" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(773.5,249) scale(1.0000)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="785.5" y="293" text-anchor="middle" font-size="16.5" font-weight="700" fill="#17509f">target.plan(cfg)</text><text x="785.5" y="314.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">ordered steps</text><text x="785.5" y="331.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">secret backend per target</text><text x="785.5" y="349.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">-&gt; DeployPlan</text><rect x="954" y="235" width="257" height="150" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1070.5,249) scale(1.0000)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6z"/></g><text x="1082.5" y="293" text-anchor="middle" font-size="16.5" font-weight="700" fill="#8c5a0d">security checks</text><text x="1082.5" y="314.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">TLS on?</text><text x="1082.5" y="331.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">deny-all egress on?</text><text x="1082.5" y="349.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">no plaintext secrets?</text><rect x="1251" y="235" width="257" height="150" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1367.5,249) scale(1.0000)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="1379.5" y="293" text-anchor="middle" font-size="16.5" font-weight="700" fill="#186547">RenderPlan</text><text x="1379.5" y="314.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">numbered plan text</text><text x="1379.5" y="331.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">exit 0 = secure</text><text x="1379.5" y="349.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">exit 1 = weakened</text><circle cx="488" cy="219" r="13" fill="#ffffff" stroke="#8494ab" stroke-width="1.8"/><text x="488" y="223.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8494ab">1</text><circle cx="785" cy="219" r="13" fill="#ffffff" stroke="#8494ab" stroke-width="1.8"/><text x="785" y="223.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8494ab">2</text><circle cx="1082" cy="219" r="13" fill="#ffffff" stroke="#8494ab" stroke-width="1.8"/><text x="1082" y="223.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8494ab">3</text><circle cx="1379" cy="219" r="13" fill="#ffffff" stroke="#8494ab" stroke-width="1.8"/><text x="1379" y="223.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8494ab">4</text><path d="M300,310.0 L358,310.0" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><path d="M617,310.0 L655,310.0" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><path d="M914,310.0 L952,310.0" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><path d="M1211,310.0 L1249,310.0" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)"/><rect x="50" y="560" width="1460" height="200" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="551" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">THREE TARGETS, ONE TARGET.PLAN INTERFACE</text><rect x="74" y="594" width="320" height="140" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(90,609) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="120" y="625" font-size="16.5" font-weight="700" fill="#17509f">local</text><text x="91" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">kind / minikube + Helm</text><text x="91" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">secret: k8s-secret</text><text x="91" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">manifest: values.yaml</text><rect x="434" y="594" width="320" height="140" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(450,609) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .6-8 6 6 0 0 0-11.4 1.7A3.6 3.6 0 0 0 7 18z"/></g><text x="480" y="625" font-size="16.5" font-weight="700" fill="#136b74">azure</text><text x="451" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Container Apps (Bicep)</text><text x="451" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">secret: Key Vault</text><text x="451" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">manifest: main.bicep</text><rect x="794" y="594" width="320" height="140" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(810,609) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .6-8 6 6 0 0 0-11.4 1.7A3.6 3.6 0 0 0 7 18z"/></g><text x="840" y="625" font-size="16.5" font-weight="700" fill="#552fae">aws</text><text x="811" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">ECS / Fargate (Terraform)</text><text x="811" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">secret: Secrets Manager</text><text x="811" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">manifest: main.tf</text><rect x="1154" y="594" width="336" height="140" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1170,609) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="1200" y="625" font-size="16.5" font-weight="700" fill="#3d4a63">DeployPlan</text><text x="1171" y="647.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">target, steps,</text><text x="1171" y="664.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">manifests, warnings</text><text x="1171" y="682.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">is_secure() -&gt; bool</text><path d="M785,385 L785,558" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="722.872" y="460.0" width="124.25599999999999" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="785" y="476.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">one target's plan</text><rect x="50" y="790" width="720" height="95.19999999999999" rx="11" fill="#fde5e7" stroke="#e05561" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="814" font-size="13.2" font-weight="700" fill="#9e2b36">Plans, does not apply</text><text x="66" y="836" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">deploy-kit prints the plan and runs the secure checks - it never calls</text><text x="66" y="854.4" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">a cloud API. apply / destroy is a stubbed seam behind a real target</text><text x="66" y="872.8" font-size="12.4" fill="#9e2b36" fill-opacity="0.92">interface; wire Terraform / Helm / cloud SDKs for production.</text><rect x="790" y="790" width="720" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="806" y="814" font-size="13.2" font-weight="700" fill="#186547">One core, six languages</text><text x="806" y="836" font-size="12.4" fill="#186547" fill-opacity="0.92">DeployConfig, the checks, the three targets + manifest renderers, target</text><text x="806" y="854.4" font-size="12.4" fill="#186547" fill-opacity="0.92">lookup, and the plan-text + exit-code renderer port byte-for-byte to Go,</text><text x="806" y="872.8" font-size="12.4" fill="#186547" fill-opacity="0.92">Rust, C#, Java, and TS. Only the CLI and stubbed apply stay Python-only.</text><text x="780.0" y="922" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/deploy-kit</text></svg>